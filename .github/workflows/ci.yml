name: Harness CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check skill registration
        run: bash scripts/list-skills.sh
      - name: Test evaluation runner, runtime tools and create-pr scripts
        run: node --test sdlc-runtime/evals/*.test.mjs skills/sdlc/create-pr/evals/tools.test.mjs
      - name: Test scoring and reports
        run: python3 -m unittest discover -s skills/eval/agent-eval/scripts -p 'test_*.py'
      - name: Test artifacts and runtime
        run: node sdlc-runtime/evals/run.mjs

      # CI has no local artifacts, so check repository configuration without --required.
      - name: Check this repository's own configuration
        run: node sdlc-runtime/tools/check-all.mjs .
