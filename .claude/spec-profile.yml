# Repository SDLC configuration.
sdlc_version: 7

# Run checks with this repository's runtime.
sdlc_runtime: "sdlc-runtime"

spec_dir: ".sdlc/specs"

# When owner is omitted, git config user.name is the default approver.

# Write artifacts in English.
lang: en

# Keep the verification command aligned with .github/workflows/ci.yml.
verify: "bash scripts/list-skills.sh && node --test sdlc-runtime/evals/*.test.mjs skills/sdlc/create-pr/evals/tools.test.mjs && python3 -m unittest discover -s skills/eval/agent-eval/scripts -p 'test_*.py' && node sdlc-runtime/evals/run.mjs"

source_roots: ["sdlc-runtime", "skills", "scripts"]

# Omit adr_dir because this repository does not track ADRs.
